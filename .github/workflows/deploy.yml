name: Build & publish site

# On every push to main: build the Vite app and publish the built dist/
# output to the "deploy" branch. Point Hostinger's Git deployment at the
# "deploy" branch so it serves the built site (not the raw source).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to push the built files to the deploy branch

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish dist/ to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
